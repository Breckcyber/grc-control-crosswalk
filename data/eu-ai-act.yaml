framework: "EU AI Act"
version: "Regulation (EU) 2024/1689"
last_updated: "2026-05-12"
source: "https://artificialintelligenceact.eu/"
description: "European Union regulation establishing harmonized rules on artificial intelligence"
controls:
  - id: "Article 3"
    name: "Definitions"
    description: "Establishes key definitions used throughout the Regulation, including: 'AI system', 'risk', 'provider', 'deployer', 'importer', 'distributor', 'operator', 'placing on the market', 'making available on the market', 'putting into service', 'general-purpose AI model', 'general-purpose AI system', 'systemic risk', 'high-impact capabilities', 'training data', 'testing data', 'biometric data', 'biometric identification', 'biometric categorisation system', 'emotion recognition system', 'remote biometric identification system', 'serious incident', and 'critical infrastructure'."
    chapter: "Chapter I — General Provisions"
    risk_tier: "not applicable"

  - id: "Article 4"
    name: "AI literacy"
    description: "Providers and deployers of AI systems must take measures to ensure, to their best extent, a sufficient level of AI literacy among their staff and other persons dealing with the operation and use of AI systems on their behalf, taking into account their technical knowledge, experience, education, training, and the context in which the AI systems are to be used."
    chapter: "Chapter I — General Provisions"
    risk_tier: "not applicable"

  - id: "Article 5"
    name: "Prohibited AI practices"
    description: "Prohibits placing on the market, putting into service, or using AI systems that: deploy subliminal, manipulative or deceptive techniques causing significant harm; exploit vulnerabilities due to age, disability, or socio-economic situation; perform social scoring leading to detrimental treatment; conduct individual criminal risk assessments based solely on profiling; create or expand facial recognition databases through untargeted scraping; infer emotions in workplace or education (except medical/safety); biometrically categorise to infer sensitive attributes (race, political opinions, religion, sexual orientation); and use real-time remote biometric identification in publicly accessible spaces for law enforcement (with narrow exceptions)."
    chapter: "Chapter II — Prohibited AI Practices"
    risk_tier: "unacceptable"

  - id: "Article 6"
    name: "Classification rules for high-risk AI systems"
    description: "Establishes the two pathways for classifying an AI system as high-risk: (1) AI systems used as a safety component of, or themselves being, a product covered by EU harmonisation legislation listed in Annex I that requires third-party conformity assessment; and (2) AI systems listed in Annex III (e.g., biometrics, critical infrastructure, education, employment, essential services, law enforcement, migration, justice and democratic processes). Includes derogations where an Annex III system does not pose a significant risk of harm."
    chapter: "Chapter III, Section 1 — Classification of AI Systems as High-Risk"
    risk_tier: "high"

  - id: "Article 7"
    name: "Amendments to Annex III"
    description: "Empowers the Commission to adopt delegated acts to amend Annex III by adding, modifying, or removing use-cases of high-risk AI systems, based on specified criteria including the intended purpose, extent of use, nature and amount of data processed, degree of autonomy, potential harm to health, safety, or fundamental rights, and the extent to which existing Union law provides adequate safeguards."
    chapter: "Chapter III, Section 1 — Classification of AI Systems as High-Risk"
    risk_tier: "high"

  - id: "Article 8"
    name: "Compliance with the requirements"
    description: "High-risk AI systems must comply with the requirements set out in Section 2 of Chapter III (Articles 9–15), taking into account their intended purpose as well as the generally acknowledged state of the art on AI and AI-related technologies. Where a high-risk AI system also falls under other Union harmonisation legislation, providers must ensure the system complies with all applicable requirements in a coherent and integrated manner to minimise duplication."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 9"
    name: "Risk management system"
    description: "Providers of high-risk AI systems must establish, implement, document, and maintain a continuous, iterative risk management system running throughout the entire lifecycle of the system. It must include: identification and analysis of known and reasonably foreseeable risks to health, safety, and fundamental rights; estimation and evaluation of risks; evaluation of other risks based on post-market monitoring data; and adoption of appropriate, targeted risk management measures. Testing must be performed to identify the most appropriate risk management measures, including against pre-defined metrics and probabilistic thresholds, with particular consideration of impacts on persons under 18 and other vulnerable groups."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 10"
    name: "Data and data governance"
    description: "High-risk AI systems that use techniques involving the training of AI models with data must be developed on the basis of training, validation, and testing data sets that meet specified quality criteria. Data governance and management practices must address: relevant design choices; data collection processes and origin; data preparation operations (annotation, labelling, cleaning, enrichment, aggregation); assumptions about what the data measures and represents; assessment of availability, quantity, and suitability; examination for biases likely to affect health and safety or cause discrimination; appropriate bias mitigation; and identification of relevant data gaps. Data sets must be relevant, sufficiently representative, free of errors, and complete in view of the intended purpose."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 11"
    name: "Technical documentation"
    description: "Technical documentation of a high-risk AI system must be drawn up before the system is placed on the market or put into service and kept up to date. It must demonstrate compliance with the requirements of Section 2 and contain the elements specified in Annex IV, including: a general description of the system; detailed description of its elements and development process; information about monitoring, functioning, and control; description of the appropriateness of performance metrics; risk management system documentation; relevant changes through the lifecycle; and a copy of the EU declaration of conformity."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 12"
    name: "Record-keeping"
    description: "High-risk AI systems must technically allow for the automatic recording of events ('logs') over their lifetime. Logging capabilities must ensure a level of traceability appropriate to the intended purpose of the system, enabling identification of situations that may result in the AI system presenting a risk or in a substantial modification, facilitating post-market monitoring, and monitoring the operation of high-risk AI systems referred to in Annex III point 1(a) (remote biometric identification). At minimum, logs must record the period of each use, the reference database against which input data has been checked, the input data for which the search led to a match, and the identification of the natural persons involved in verifying the results."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 13"
    name: "Transparency and provision of information to deployers"
    description: "High-risk AI systems must be designed and developed in such a way as to ensure that their operation is sufficiently transparent to enable deployers to interpret the system's output and use it appropriately. Systems must be accompanied by instructions for use containing concise, complete, correct, and clear information, including: identity and contact details of the provider; characteristics, capabilities, and limitations of performance; circumstances that may lead to risks; technical capabilities to provide information relevant to explain output; performance regarding specific persons or groups; specifications for input data; human oversight measures; computational and hardware resources; expected lifetime; and maintenance and care measures."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 14"
    name: "Human oversight"
    description: "High-risk AI systems must be designed and developed in such a way that they can be effectively overseen by natural persons during the period in which they are in use. Oversight measures must aim to prevent or minimise risks to health, safety, or fundamental rights. Measures must enable persons assigned to human oversight to: properly understand the relevant capacities and limitations of the system and monitor its operation; remain aware of automation bias; correctly interpret the system's output; decide not to use the system or otherwise disregard, override, or reverse its output; and intervene in or interrupt the system through a 'stop' button or similar procedure. For Annex III point 1(a) systems, verification by at least two natural persons with the necessary competence, training, and authority is required."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 15"
    name: "Accuracy, robustness and cybersecurity"
    description: "High-risk AI systems must be designed and developed to achieve an appropriate level of accuracy, robustness, and cybersecurity, and to perform consistently in those respects throughout their lifecycle. Levels of accuracy and the relevant accuracy metrics must be declared in the instructions for use. Systems must be as resilient as possible against errors, faults, or inconsistencies, and against attempts by unauthorised third parties to alter their use, outputs, or performance by exploiting system vulnerabilities. Technical solutions must address AI-specific vulnerabilities including data poisoning, model poisoning, adversarial examples, model evasion, confidentiality attacks, and model flaws. Systems that continue to learn after being placed on the market must include mitigations against feedback loops."
    chapter: "Chapter III, Section 2 — Requirements for High-Risk AI Systems"
    risk_tier: "high"

  - id: "Article 16"
    name: "Provider obligations"
    description: "Providers of high-risk AI systems must: ensure their systems comply with the requirements in Section 2; indicate their name, registered trade name or trade mark, and contact address; have a quality management system in place (Article 17); keep documentation (Article 18); keep logs automatically generated by their systems (Article 19); ensure the system undergoes the relevant conformity assessment procedure (Article 43) prior to placing on the market; draw up an EU declaration of conformity (Article 47); affix the CE marking (Article 48); comply with registration obligations (Article 49); take necessary corrective actions and provide information (Article 20); demonstrate conformity upon request from a competent authority; and ensure accessibility requirements are met."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 17"
    name: "Quality management system"
    description: "Providers of high-risk AI systems must put a quality management system in place that ensures compliance with the Regulation, documented in a systematic and orderly manner through written policies, procedures, and instructions. The system must include at least: a strategy for regulatory compliance; techniques, procedures, and systematic actions for design, design control, and design verification; for development, quality control, and quality assurance; examination, test, and validation procedures; technical specifications; systems and procedures for data management; the risk management system (Article 9); post-market monitoring (Article 72); procedures for serious incident reporting (Article 73); communications with competent authorities; record-keeping; resource management; and an accountability framework."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 22"
    name: "Authorised representatives"
    description: "Prior to making high-risk AI systems available on the Union market, providers established in third countries must, by written mandate, appoint an authorised representative established in the Union. The authorised representative must perform tasks specified in the mandate, including: verifying that the EU declaration of conformity and technical documentation have been drawn up; keeping at the disposal of competent authorities the contact details of the provider, a copy of the declaration of conformity, technical documentation, and certificates; cooperating with competent authorities; complying with registration obligations; and terminating the mandate if the provider acts contrary to its obligations under the Regulation."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 23"
    name: "Importers obligations"
    description: "Before placing a high-risk AI system on the market, importers must ensure that: the relevant conformity assessment procedure has been carried out by the provider; the provider has drawn up the technical documentation; the system bears the required CE marking and is accompanied by the EU declaration of conformity and instructions for use; and the provider has appointed an authorised representative. Importers must indicate their name, registered trade name or trade mark, and contact address on the system or on its packaging. They must ensure storage and transport conditions do not jeopardise compliance, keep relevant documentation for ten years, and cooperate with competent authorities."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 24"
    name: "Distributors obligations"
    description: "Before making a high-risk AI system available on the market, distributors must verify that: the system bears the required CE marking; it is accompanied by the EU declaration of conformity and instructions for use; and the provider and importer have complied with their respective obligations regarding identification and documentation. Distributors must ensure storage and transport conditions do not jeopardise compliance. Where they consider or have reason to consider that a system is not in conformity, they must not make it available until brought into conformity. If the system presents a risk, they must inform the provider or importer and competent authorities."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 26"
    name: "Deployer obligations"
    description: "Deployers of high-risk AI systems must: take appropriate technical and organisational measures to ensure use in accordance with the instructions for use; assign human oversight to natural persons with the necessary competence, training, authority, and support; ensure input data is relevant and sufficiently representative in view of the intended purpose; monitor operation based on the instructions for use and inform providers of risks or serious incidents; keep logs automatically generated by the system for an appropriate period (at least six months); inform workers' representatives and affected workers before putting a system into service in the workplace; comply with registration obligations; carry out a data protection impact assessment where applicable; and inform natural persons subject to the use of high-risk AI systems."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 27"
    name: "Fundamental rights impact assessment"
    description: "Prior to deploying certain high-risk AI systems (those listed in Annex III, with limited exceptions, used by bodies governed by public law, private entities providing public services, or certain banking and insurance use cases), deployers must perform a fundamental rights impact assessment (FRIA). The assessment must include: a description of the deployer's processes in which the system will be used; the period of time and frequency of use; categories of natural persons and groups likely to be affected; specific risks of harm likely to impact those persons or groups; a description of human oversight measures; and measures to be taken if risks materialise, including governance and complaint mechanisms. Deployers must notify the market surveillance authority of results."
    chapter: "Chapter III, Section 3 — Obligations of Providers and Deployers of High-Risk AI Systems and Other Parties"
    risk_tier: "high"

  - id: "Article 50"
    name: "Transparency obligations for certain AI systems"
    description: "Providers must ensure AI systems intended to interact directly with natural persons are designed and developed so that those persons are informed they are interacting with an AI system, unless this is obvious. Providers of AI systems generating synthetic audio, image, video, or text content must ensure outputs are marked in a machine-readable format and detectable as artificially generated or manipulated. Deployers of emotion recognition or biometric categorisation systems must inform natural persons exposed to them. Deployers of AI systems generating or manipulating image, audio, or video content constituting a deep fake must disclose that the content has been artificially generated or manipulated. Deployers of AI systems generating or manipulating text published to inform the public on matters of public interest must disclose that the text has been artificially generated or manipulated, with limited exceptions."
    chapter: "Chapter IV — Transparency Obligations for Providers and Deployers of Certain AI Systems"
    risk_tier: "limited"

  - id: "Article 51"
    name: "Classification of general-purpose AI models as general-purpose AI models with systemic risk"
    description: "A general-purpose AI model is classified as having systemic risk if it has high-impact capabilities evaluated on the basis of appropriate technical tools and methodologies, including indicators and benchmarks, or based on a Commission decision (ex officio or following a qualified alert from the scientific panel). A general-purpose AI model is presumed to have high-impact capabilities when the cumulative amount of computation used for its training measured in floating point operations is greater than 10^25 FLOPs. Providers must notify the Commission without delay (and in any event within two weeks) where their model meets the threshold."
    chapter: "Chapter V — General-Purpose AI Models"
    risk_tier: "general-purpose"

  - id: "Article 53"
    name: "Obligations for providers of general-purpose AI models"
    description: "Providers of general-purpose AI models must: draw up and keep up-to-date technical documentation of the model including its training and testing process and results of evaluation (Annex XI); draw up and make available information and documentation to downstream providers who intend to integrate the model into their AI systems (Annex XII); put in place a policy to comply with Union copyright law, in particular to identify and comply with reservations of rights under Article 4(3) of Directive (EU) 2019/790; and draw up and make publicly available a sufficiently detailed summary about the content used for training of the model, according to a template provided by the AI Office. Obligations do not apply to providers of models released under a free and open-source licence whose parameters, including weights, architecture, and usage information, are made publicly available, except where they are general-purpose AI models with systemic risk."
    chapter: "Chapter V — General-Purpose AI Models"
    risk_tier: "general-purpose"

  - id: "Article 55"
    name: "Obligations for providers of general-purpose AI models with systemic risk"
    description: "In addition to the obligations in Article 53, providers of general-purpose AI models with systemic risk must: perform model evaluation in accordance with standardised protocols and tools reflecting the state of the art, including conducting and documenting adversarial testing of the model with a view to identifying and mitigating systemic risks; assess and mitigate possible systemic risks at Union level, including their sources, that may stem from development, placing on the market, or use of the models; keep track of, document, and report without undue delay to the AI Office and, as appropriate, to national competent authorities, relevant information about serious incidents and possible corrective measures; and ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic risk and the physical infrastructure of the model."
    chapter: "Chapter V — General-Purpose AI Models"
    risk_tier: "general-purpose"

  - id: "Article 72"
    name: "Post-market monitoring by providers and post-market monitoring plan for high-risk AI systems"
    description: "Providers of high-risk AI systems must establish and document a post-market monitoring system in a manner that is proportionate to the nature of the AI technologies and the risks. The system must actively and systematically collect, document, and analyse relevant data on the performance of high-risk AI systems throughout their lifetime, provided either by deployers or collected through other sources, allowing the provider to evaluate continuous compliance with the requirements set out in Chapter III, Section 2. The post-market monitoring system must be based on a post-market monitoring plan, which is part of the technical documentation, with a template to be provided by the Commission."
    chapter: "Chapter IX — Post-Market Monitoring, Information Sharing and Market Surveillance"
    risk_tier: "high"

  - id: "Article 73"
    name: "Reporting of serious incidents"
    description: "Providers of high-risk AI systems placed on the Union market must report any serious incident to the market surveillance authorities of the Member States where that incident occurred. Reporting must be made immediately after the provider has established a causal link or reasonable likelihood of such a link between the AI system and the serious incident, and in any event not later than 15 days after the provider (or, where applicable, the deployer) becomes aware. For incidents involving widespread infringement or breakdown of critical infrastructure, the period is two days; for death of a person, ten days. Providers must conduct necessary investigations, including a risk assessment and corrective actions, without destroying evidence."
    chapter: "Chapter IX — Post-Market Monitoring, Information Sharing and Market Surveillance"
    risk_tier: "high"

  - id: "Article 95"
    name: "Codes of conduct for voluntary application of specific requirements"
    description: "The AI Office and Member States must encourage and facilitate the drawing up of codes of conduct, including related governance mechanisms, intended to foster the voluntary application to AI systems (other than high-risk AI systems) of some or all of the requirements set out in Chapter III, Section 2, taking into account available technical solutions and industry best practices. The AI Office and Member States must also facilitate the drawing up of codes of conduct concerning the voluntary application of specific requirements to all AI systems, on the basis of clear objectives and key performance indicators to measure the achievement of those objectives, including elements such as: assessing and minimising AI impact on environmental sustainability; promoting AI literacy; facilitating inclusive and diverse design; and assessing and preventing negative impact on vulnerable persons or groups."
    chapter: "Chapter X — Codes of Conduct and Guidelines"
    risk_tier: "not applicable"

  - id: "Article 99"
    name: "Penalties"
    description: "Member States must lay down rules on penalties and other enforcement measures, which must be effective, proportionate, and dissuasive. Non-compliance with the prohibition of AI practices referred to in Article 5 is subject to administrative fines of up to EUR 35 000 000 or, if the offender is an undertaking, up to 7% of its total worldwide annual turnover for the preceding financial year, whichever is higher. Non-compliance with provisions related to operators or notified bodies (other than Article 5) is subject to fines of up to EUR 15 000 000 or up to 3% of worldwide annual turnover. The supply of incorrect, incomplete, or misleading information to notified bodies or competent authorities is subject to fines of up to EUR 7 500 000 or up to 1% of worldwide annual turnover. For SMEs, including start-ups, the lower of the two amounts applies."
    chapter: "Chapter XII — Penalties"
    risk_tier: "not applicable"
audit_readiness_version: "1.0"
last_updated: "2026-06-02"
methodology: "Audit-readiness packages generated to support control testing. Each package includes evidence requirements, testing procedures, pass/fail criteria, a sample finding, a risk rating, and a remediation recommendation. Practitioner review required before use in a live audit."
controls:
  - framework: "ISO 27001:2022"
    id: "A.5.1"
    name: "Policies for information security"
    evidence_requirements:
      - "Approved information security policy document"
      - "Record of management approval (signature/date)"
      - "Evidence of communication to staff (distribution log, intranet posting)"
      - "Record of most recent policy review (within 12 months)"
    testing_procedure:
      - "Obtain the current information security policy document"
      - "Verify it has documented management approval and an approval date"
      - "Confirm the policy has been communicated to relevant personnel"
      - "Check the date of the last review is within the past 12 months"
    pass_criteria: "Policy exists, is formally approved by management, has been communicated to staff, and was reviewed within the last 12 months."
    fail_criteria: "Policy is missing, unapproved, not communicated, or not reviewed within 12 months."
    sample_finding: "Information security policy exists and is approved, but there is no evidence of review within the past 18 months, exceeding the 12-month review cycle."
    risk_rating: "Medium"
    remediation: "Establish a documented annual policy review cadence with assigned owner and management sign-off; update the policy and record the review date."

  - framework: "ISO 27001:2022"
    id: "A.5.15"
    name: "Access control"
    evidence_requirements:
      - "Access control policy defining rules for logical and physical access"
      - "Role definitions or access control matrix mapping roles to entitlements"
      - "User access provisioning and deprovisioning (joiner/mover/leaver) records"
      - "Records of periodic user access reviews and resulting remediation"
      - "Evidence that access is granted on a least-privilege and need-to-know basis"
    testing_procedure:
      - "Obtain the access control policy and confirm it addresses business and security requirements"
      - "Select a sample of users and verify their access matches their assigned role and job function"
      - "Trace a sample of new joiners and leavers through the provisioning and deprovisioning process"
      - "Confirm periodic access reviews were performed and exceptions were remediated"
    pass_criteria: "Access control rules are documented and based on business need; access is provisioned and revoked through a controlled process; least privilege is applied; and periodic access reviews are performed with remediation evidence."
    fail_criteria: "No documented access control rules, access not aligned to least privilege, leavers retain active access, or no evidence of periodic access reviews."
    sample_finding: "A sample of 25 user accounts identified 3 terminated employees whose accounts remained active more than 30 days after their departure date, indicating the deprovisioning process is not consistently enforced."
    risk_rating: "High"
    remediation: "Integrate deprovisioning with the HR leaver process to disable access on the termination date; perform an immediate review of all active accounts against current employment status; and formalize quarterly access reviews with documented sign-off."

  - framework: "ISO 27001:2022"
    id: "A.5.19"
    name: "Supplier relationships"
    evidence_requirements:
      - "Policy or process governing information security in supplier relationships"
      - "Supplier inventory or register identifying suppliers and the services they provide"
      - "Supplier risk assessments performed prior to or during engagement"
      - "Contracts or agreements containing information security requirements and clauses"
      - "Evidence of supplier due diligence (e.g., security questionnaires, certifications reviewed)"
    testing_procedure:
      - "Obtain the supplier management policy and confirm it defines how supplier security risks are managed"
      - "Select a sample of suppliers from the register and confirm a risk assessment was performed"
      - "Verify contracts for sampled suppliers include information security requirements"
      - "Confirm due diligence evidence exists proportionate to the supplier's risk and access"
    pass_criteria: "Supplier security risks are managed through a defined process; suppliers are inventoried and risk-assessed; and contracts include appropriate information security requirements supported by due diligence."
    fail_criteria: "No supplier security process or register, suppliers engaged without risk assessment, or contracts lacking information security requirements."
    sample_finding: "Of 10 sampled suppliers, 2 higher-risk vendors with access to internal systems had no documented security risk assessment on file at the time of engagement."
    risk_rating: "Medium"
    remediation: "Maintain a complete supplier register tiered by risk; require a documented security risk assessment before onboarding any supplier with system or data access; and standardize information security clauses in supplier contracts."

  - framework: "ISO 27001:2022"
    id: "A.5.24"
    name: "Incident management planning"
    evidence_requirements:
      - "Information security incident management plan or procedure"
      - "Defined incident response roles, responsibilities, and escalation paths"
      - "Incident classification or severity criteria"
      - "Internal and external communication procedures for incidents"
      - "Evidence of testing or exercising the incident response process (e.g., tabletop)"
    testing_procedure:
      - "Obtain the incident management plan and confirm roles and responsibilities are defined"
      - "Verify the plan includes classification criteria and escalation procedures"
      - "Confirm communication procedures cover internal stakeholders and relevant external parties"
      - "Check for evidence the plan has been tested or exercised within a defined period"
    pass_criteria: "An incident management plan is documented and communicated, with defined roles, classification criteria, escalation, and communication procedures, and has been tested within a defined period."
    fail_criteria: "No documented incident plan, undefined roles or escalation, or no evidence the plan has ever been tested or communicated."
    sample_finding: "An incident management plan exists with defined roles, but no incident response exercise or tabletop has been conducted in the past 24 months, so plan effectiveness is unverified."
    risk_rating: "Medium"
    remediation: "Schedule and document at least annual incident response exercises; capture lessons learned; and update the plan, roles, and contact details based on exercise outcomes."

  - framework: "ISO 27001:2022"
    id: "A.6.3"
    name: "Awareness and training"
    evidence_requirements:
      - "Information security awareness and training program or plan"
      - "Training materials, including any role-specific content"
      - "Training completion records by individual and date"
      - "Schedule or cadence for recurring awareness training"
      - "Evidence training is provided to new joiners during onboarding"
    testing_procedure:
      - "Obtain the awareness and training program and confirm it covers relevant job functions"
      - "Select a sample of personnel and verify training completion records"
      - "Confirm new joiners received security training as part of onboarding"
      - "Verify training is refreshed on a defined recurring basis"
    pass_criteria: "A security awareness and training program exists, covers relevant roles, is delivered to new joiners and refreshed periodically, and completion is recorded for personnel."
    fail_criteria: "No training program, training not delivered or recorded, or no recurring refresh of awareness content."
    sample_finding: "From a sample of 30 employees, 5 had no record of completing the annual security awareness training, indicating completion is not consistently tracked or enforced."
    risk_rating: "Medium"
    remediation: "Deploy security awareness training to all personnel with automated completion tracking; enforce completion for new joiners during onboarding; and follow up on overdue completions with management escalation."

  - framework: "ISO 27001:2022"
    id: "A.8.15"
    name: "Logging"
    evidence_requirements:
      - "Logging policy or standard defining what events must be logged"
      - "Inventory of systems generating logs and the event types captured"
      - "Log retention configuration and evidence of the retention period applied"
      - "Controls protecting logs from unauthorized access or alteration"
      - "Evidence that logs are reviewed or analysed"
    testing_procedure:
      - "Obtain the logging standard and confirm it defines required events and retention"
      - "Select a sample of in-scope systems and verify logging is enabled per the standard"
      - "Confirm logs are retained for the defined period and protected against tampering"
      - "Verify evidence that logs are reviewed or fed into analysis"
    pass_criteria: "Logging is defined by a standard, enabled on in-scope systems, retained for the required period, protected against alteration, and subject to review or analysis."
    fail_criteria: "No logging standard, logging disabled on in-scope systems, insufficient retention, unprotected logs, or no review."
    sample_finding: "Logging is enabled across in-scope systems, but log review is performed ad hoc with no documented schedule or evidence of who reviewed logs or when."
    risk_rating: "Medium"
    remediation: "Define a logging standard specifying required events, retention, and protection; centralize logs with access controls and integrity protection; and establish a documented log review cadence with retained evidence."

  - framework: "ISO 27001:2022"
    id: "A.8.16"
    name: "Monitoring activities"
    evidence_requirements:
      - "Monitoring policy or standard covering networks, systems, and applications"
      - "Configuration of monitoring tooling (e.g., SIEM, IDS/IPS) and its coverage scope"
      - "Defined alert rules, thresholds, or baselines for anomalous behaviour"
      - "Records of alerts generated and how they were triaged or actioned"
      - "Procedures linking monitoring alerts to the incident response process"
    testing_procedure:
      - "Obtain the monitoring standard and confirm coverage of networks, systems, and applications"
      - "Verify monitoring tooling is deployed across the defined scope"
      - "Confirm alert rules or baselines exist to detect anomalous behaviour"
      - "Select a sample of alerts and verify they were triaged and actioned appropriately"
    pass_criteria: "Monitoring covers in-scope networks, systems, and applications; anomaly detection rules or baselines are defined; and alerts are triaged and actioned with linkage to incident response."
    fail_criteria: "No monitoring standard, gaps in monitoring coverage, no alerting rules, or alerts not triaged or actioned."
    sample_finding: "Monitoring tooling is in place, but a sample of 15 alerts showed 4 with no recorded triage outcome, indicating alerts are not consistently followed through to resolution."
    risk_rating: "Medium"
    remediation: "Define monitoring coverage and tune alert rules to reduce noise; require documented triage and disposition for every alert; and integrate alert handling with the incident response process."

  - framework: "NIST CSF 2.0"
    id: "GV.PO-01"
    name: "Cybersecurity policy"
    evidence_requirements:
      - "Documented cybersecurity policy approved by senior leadership"
      - "Evidence the policy reflects organizational context, strategy, and risk priorities"
      - "Records showing the policy was communicated across the organization"
      - "Evidence of policy enforcement (e.g., references in standards, monitoring, or sanctions)"
      - "Record of the most recent policy review and update"
    testing_procedure:
      - "Obtain the cybersecurity policy and confirm senior leadership approval"
      - "Verify the policy aligns with organizational context and cybersecurity strategy"
      - "Confirm the policy has been communicated to the workforce"
      - "Check for evidence of enforcement and a recent review date"
    pass_criteria: "A cybersecurity policy is approved by leadership, reflects organizational context and strategy, is communicated organization-wide, enforced, and reviewed on a defined cycle."
    fail_criteria: "Policy missing, not leadership-approved, not communicated, not enforced, or not reviewed on a defined cycle."
    sample_finding: "A cybersecurity policy is approved and published, but enforcement is informal - there is no documented mechanism (monitoring, attestation, or sanctions) demonstrating the policy is enforced."
    risk_rating: "Medium"
    remediation: "Define and document enforcement mechanisms such as annual workforce attestation, mapping of policy to operational standards, and consequences for non-compliance; record review and update on a defined cycle."

  - framework: "NIST CSF 2.0"
    id: "ID.RA-01"
    name: "Vulnerabilities identified"
    evidence_requirements:
      - "Vulnerability management policy or procedure"
      - "Vulnerability scan reports across in-scope assets"
      - "Vulnerability register recording identified and validated vulnerabilities"
      - "Remediation tracking with risk-based prioritization and SLAs"
      - "Evidence of validation to confirm vulnerabilities are real and not false positives"
    testing_procedure:
      - "Obtain the vulnerability management procedure and confirm scope and frequency"
      - "Verify recent scan results cover in-scope assets"
      - "Confirm identified vulnerabilities are validated and recorded in a register"
      - "Select a sample of vulnerabilities and verify remediation tracking against SLAs"
    pass_criteria: "Vulnerabilities are identified through regular scanning across in-scope assets, validated, recorded in a register, and tracked to remediation against risk-based SLAs."
    fail_criteria: "No regular scanning, incomplete asset coverage, vulnerabilities not validated or recorded, or no remediation tracking."
    sample_finding: "Vulnerability scans run monthly, but a sample of high-severity findings showed several open beyond the 30-day remediation SLA with no documented risk acceptance or exception."
    risk_rating: "High"
    remediation: "Enforce risk-based remediation SLAs with escalation for overdue high-severity items; require documented risk acceptance for any exceptions; and confirm scan coverage includes all in-scope assets."

  - framework: "NIST CSF 2.0"
    id: "PR.AA-05"
    name: "Access permissions managed"
    evidence_requirements:
      - "Access management policy defining entitlements, least privilege, and separation of duties"
      - "Documented entitlements or roles mapped to job functions"
      - "Evidence access is enforced (e.g., system configuration, RBAC)"
      - "Records of periodic access and entitlement reviews and remediation"
      - "Evidence that separation-of-duties conflicts are identified and managed"
    testing_procedure:
      - "Obtain the access management policy and confirm it addresses least privilege and separation of duties"
      - "Select a sample of users and verify entitlements align with job function"
      - "Confirm periodic access reviews were performed and exceptions remediated"
      - "Verify separation-of-duties conflicts are detected and managed"
    pass_criteria: "Access permissions are defined in policy, enforced with least privilege and separation of duties, and reviewed periodically with remediation of exceptions."
    fail_criteria: "No access policy, excessive entitlements, unmanaged separation-of-duties conflicts, or no periodic review."
    sample_finding: "A sample of privileged accounts revealed two users with standing administrative access that exceeded their current role, and the most recent access review did not flag the discrepancy."
    risk_rating: "High"
    remediation: "Right-size privileged access to current roles; implement least-privilege and just-in-time access where feasible; and strengthen periodic access reviews to detect entitlement creep and separation-of-duties conflicts."

  - framework: "NIST CSF 2.0"
    id: "DE.CM-01"
    name: "Networks monitored"
    evidence_requirements:
      - "Network monitoring policy or standard"
      - "Inventory of network monitoring tooling and its coverage of network segments"
      - "Defined detection rules or baselines for adverse network events"
      - "Records of network alerts and their triage and disposition"
      - "Evidence of coverage across key ingress/egress and internal segments"
    testing_procedure:
      - "Obtain the network monitoring standard and confirm scope of coverage"
      - "Verify monitoring tooling covers key network segments and boundaries"
      - "Confirm detection rules or baselines exist to identify adverse events"
      - "Select a sample of network alerts and confirm triage and disposition"
    pass_criteria: "Networks and network services are monitored across key segments and boundaries, detection rules are defined, and adverse events are triaged and dispositioned."
    fail_criteria: "No network monitoring, coverage gaps at key boundaries, no detection rules, or alerts not triaged."
    sample_finding: "Network monitoring covers the perimeter, but east-west (internal) traffic between segments is not monitored, leaving lateral movement detection as a gap."
    risk_rating: "Medium"
    remediation: "Extend network monitoring to internal east-west traffic and key segment boundaries; tune detection rules for lateral movement; and document triage outcomes for network alerts."

  - framework: "ISO/IEC 42001:2023"
    id: "A.5.2"
    name: "AI system impact assessment"
    evidence_requirements:
      - "Documented AI system impact assessment process or methodology"
      - "Completed impact assessments for in-scope AI systems"
      - "Evidence the assessment considers impacts on individuals, groups, and society"
      - "Records of who performed and approved each impact assessment"
      - "Evidence impact assessments are performed at appropriate AI lifecycle stages"
      - "Confirm against organizational context and original framework text (verify Annex A clause wording)"
    testing_procedure:
      - "Obtain the AI impact assessment process and confirm it is documented and assigned an owner"
      - "Select a sample of in-scope AI systems and verify an impact assessment was completed"
      - "Confirm assessments consider impacts on individuals, groups, and society"
      - "Verify assessments are reviewed or approved and performed at appropriate lifecycle points"
    pass_criteria: "A documented AI system impact assessment process exists, is applied to in-scope AI systems across the lifecycle, considers impacts on individuals, groups, and society, and assessments are reviewed and approved."
    fail_criteria: "No impact assessment process, AI systems deployed without assessment, or assessments that omit affected individuals, groups, or societal impacts."
    sample_finding: "An AI impact assessment template exists, but 2 of 4 AI systems sampled were deployed to production without a completed impact assessment on record."
    risk_rating: "Medium"
    remediation: "Make a completed AI system impact assessment a mandatory gate before production deployment; assign ownership and approval; and confirm the assessment scope against the organization's context and the ISO/IEC 42001 Annex A control text."

  - framework: "ISO/IEC 42001:2023"
    id: "A.9.2"
    name: "Human oversight"
    evidence_requirements:
      - "Documented human oversight measures defined for in-scope AI systems"
      - "Definition of decision points where human review, approval, or intervention is required"
      - "Evidence overseers have the competence, authority, and tools to intervene or override"
      - "Records of human review, override, or intervention actions"
      - "Confirm against organizational context and original framework text (verify Annex A clause wording and whether A.9.2 is titled 'human oversight')"
    testing_procedure:
      - "Obtain documentation of human oversight measures for sampled AI systems"
      - "Verify intervention and override points are defined and technically supported"
      - "Confirm assigned overseers have appropriate competence and authority"
      - "Select a sample of decisions and verify human oversight was exercised and recorded"
    pass_criteria: "Human oversight measures are defined for in-scope AI systems, intervention and override are technically supported, overseers are competent and authorized, and oversight actions are recorded."
    fail_criteria: "No defined human oversight, no ability to intervene or override, overseers lacking competence or authority, or no record of oversight."
    sample_finding: "Human oversight is described in policy, but for one automated decisioning system there is no technical mechanism for an operator to override an output before it takes effect."
    risk_rating: "High"
    remediation: "Implement technical override and intervention controls for AI systems affecting individuals; define and train designated overseers; log oversight actions; and confirm the control's exact scope and clause reference against the ISO/IEC 42001 Annex A text."

  - framework: "NIST AI RMF 1.0"
    id: "MAP 1.1"
    name: "AI system context"
    evidence_requirements:
      - "Documentation of the AI system's intended purpose and context of use"
      - "Identification of intended users and affected stakeholders and their expectations"
      - "Documented potential positive and negative impacts of the system's use"
      - "Applicable laws, norms, and expectations for the deployment context"
      - "Documented assumptions and limitations about purpose, uses, and risks"
    testing_procedure:
      - "Obtain AI system context documentation and confirm intended purpose is defined"
      - "Verify intended users and affected stakeholders are identified"
      - "Confirm potential positive and negative impacts are documented"
      - "Check that applicable legal and normative context and key assumptions are recorded"
    pass_criteria: "The AI system's intended purpose, users, stakeholders, impacts, applicable context, and key assumptions and limitations are documented and maintained."
    fail_criteria: "Intended purpose or context undocumented, stakeholders or impacts not identified, or assumptions and limitations not recorded."
    sample_finding: "Intended purpose and users are documented for the AI system, but potential negative impacts on affected non-user groups were not assessed or recorded."
    risk_rating: "Medium"
    remediation: "Expand context documentation to capture impacts on affected non-users and the broader deployment context; document assumptions and limitations; and review context as the system or its use evolves."

  - framework: "EU AI Act"
    id: "Article 14"
    name: "Human oversight"
    evidence_requirements:
      - "Documentation showing the high-risk AI system is designed to enable human oversight"
      - "Description of the human-machine interface tools provided for oversight"
      - "Instructions for use describing oversight measures and system limitations"
      - "Evidence persons assigned oversight have the competence, training, and authority to act"
      - "Evidence of the ability to intervene, override, or stop the system (and four-eyes verification where required)"
    testing_procedure:
      - "Obtain technical documentation and confirm oversight measures are built into the system"
      - "Verify the human-machine interface enables monitoring, interpretation, and intervention"
      - "Confirm assigned overseers are trained and authorized to act"
      - "Verify mechanisms to override or stop the system function as documented"
    pass_criteria: "The high-risk AI system enables effective human oversight: oversight measures and interfaces are documented, overseers are competent and authorized, and they can interpret output, intervene, override, or stop the system."
    fail_criteria: "Oversight measures absent or ineffective, no interface for intervention, overseers untrained or unauthorized, or no ability to override or stop the system."
    sample_finding: "Oversight measures are documented, but overseers received no specific training on automation bias or on correctly interpreting the system's outputs, weakening effective oversight."
    risk_rating: "High"
    remediation: "Provide role-specific training covering system limitations, automation bias, and output interpretation; ensure overseers are empowered and able to intervene or stop the system; align oversight measures with the provider's instructions for use; and confirm scope against the original Article 14 text and applicable implementing guidance."